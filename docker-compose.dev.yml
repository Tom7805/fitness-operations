# Hạ tầng cho máy phát triển: chỉ chạy cơ sở dữ liệu, backend và frontend chạy trực tiếp trên máy.
#   docker compose -f docker-compose.dev.yml up -d
name: fitness-operations-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fitness_operations}
      POSTGRES_USER: ${DB_USERNAME:-fitness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fitness}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
