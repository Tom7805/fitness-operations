spring:
  application:
    name: fitness-operations
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitness_operations}
    username: ${DB_USERNAME:fitness}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Skeleton có sẵn các file migration rỗng (V3 … V13) cho tính năng chưa làm. Flyway sẽ ghi chúng là "đã chạy"
    # với checksum 0, và khi được điền nội dung sau này mọi cơ sở dữ liệu đã chạy sẽ lỗi kiểm tra checksum.
    # Vì vậy chỉ chạy tới phiên bản cuối cùng đã hiện thực; story điền migration mới thì tăng giá trị này.
    target: "2"
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

app:
  security:
    jwt:
      # Khóa HMAC-SHA256 mã hóa Base64, tối thiểu 256 bit. Bắt buộc cấu hình qua biến môi trường ngoài môi trường dev.
      secret: ${JWT_SECRET:}
      issuer: fitness-operations
    auth:
      max-failed-attempts: 5
      lock-duration: 15m
      idle-timeout: 30m
      absolute-timeout: 12h
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
